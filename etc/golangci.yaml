version: "2"
run:
  modules-download-mode: readonly
  tests: true
linters:
  default: all
  disable:
    - asasalint
    - containedctx
    - contextcheck
    - cyclop
    - depguard
    - err113
    - exhaustruct
    - forcetypeassert
    - funlen
    - gochecknoglobals
    - gochecknoinits
    - gocognit
    - gocyclo
    - godox
    - importas
    - interfacebloat
    - intrange
    - ireturn
    - maintidx
    - makezero
    - mnd
    - musttag
    - nakedret
    - nestif
    - nilnil
    - nlreturn
    - nonamedreturns
    - nosprintfhostport
    - paralleltest
    - prealloc
    - tagliatelle
    - testpackage
    - thelper # false positives
    - varnamelen
    - wrapcheck
    - wsl
    # New in golangci-lint v2; keep behavior close to the previous enable-all set.
    - funcorder
    - godoclint
    - modernize
    - noinlineerr
    - wsl_v5
  settings:
    errcheck:
      check-blank: true
    gosec:
      excludes:
        - G115
    govet:
      disable:
        - fieldalignment
        - shadow
        - composites
      enable-all: true
    lll:
      line-length: 140
    revive:
      # Unfortunately configuring a single rules disables all other rules, even
      # if we set enable-all / default: all.
      #
      # To get around this, we include default rules:
      # https://github.com/mgechev/revive/blob/master/defaults.toml
      rules:
        - name: blank-imports
        - name: context-as-argument
          arguments:
            - allowTypesBefore: testing.TB,*testing.T,*testing.B,*testing.F
          disabled: false
        - name: context-keys-type
        - name: dot-imports
        - name: empty-block
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: exported
        - name: increment-decrement
        - name: indent-error-flow
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: var-declaration
        - name: var-naming
  exclusions:
    # Preserve v1 exclude-use-default: false (no default exclusion presets).
    presets: []
    generated: lax
    rules:
      - linters:
          - dupword
          - errcheck
          - exhaustive
          - goconst
          - gosec
        path: _test\.go$
      - linters:
          - lll
        path: /doc.go$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gci
    - gofumpt
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/viam-modules/beagleboard)
    gofumpt:
      extra-rules: true
  exclusions:
    generated: lax
